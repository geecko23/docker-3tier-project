apiVersion: apps/v1
kind: Deployment

metadata:
  name: app
  labels:
    app: app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: app

  template:
    metadata:
      labels:
        app: app

    spec:
      containers:
        - name: app
          image: docker-3tier-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          env:
            - name: REDIS_HOST
              value: redis-service

            - name: REDIS_PORT
              value: "6379"
 
            - name: DB_HOST
              value: mysql-service

            - name: DB_PORT
              value: "3306"


